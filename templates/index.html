/* ============================
   УТИЛИТА: превратить имя файла в читаемый заголовок
   "Project1 - cryptomail (pet).jpg" → "Project1 cryptomail (pet)"
   ============================ */
function fileToTitle(filename) {
    const baseName = filename.replace(/\.[^.]+$/, '');
    return baseName.replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
}

/* ============================
   ГЕНЕРАЦИЯ screenshots.md ИЗ ФАЙЛОВ ПАПКИ
   ============================ */
function buildScreenshots(files) {
    if (!files.length) {
        return [
            '<span class="kw"># Project Screenshots</span>',
            '',
            '<span class="op">Пока пусто. Положи картинки в static/projects/ и обнови страницу.</span>'
        ];
    }

    const lines = [
        '<span class="kw"># Project Screenshots</span>',
        '',
        '<span class="op">Галерея моих проектов — ' + files.length + ' шт.</span>',
        ''
    ];

    files.forEach((filename) => {
        const title = fileToTitle(filename);

        lines.push('<span class="kw">## 📸 ' + title + '</span>');
        lines.push(
            '<div class="md-image-wrap">' +
                '<img src="/static/projects/' + encodeURIComponent(filename) + '" ' +
                     'alt="' + title + '" ' +
                     'onerror="this.parentElement.classList.add(\'missing\')">' +
            '</div>'
        );
        lines.push('');
    });

    return lines;
}

const tabsBar  = document.getElementById("tabs");
const codeArea = document.getElementById("code-area");
const openTabs = new Set();
let   activeFile = null;

function openFile(name) {
    if (!FILES[name]) return;

    if (!openTabs.has(name)) {
        openTabs.add(name);
        const tab = document.createElement("div");
        tab.className = "tab";
        tab.dataset.file = name;
        tab.innerHTML = `
            <span class="icon">${FILES[name].icon}</span>
            <span class="tab-name">${name}</span>
            <span class="close" data-close="${name}">×</span>
        `;
        tab.addEventListener("click", (e) => {
            if (e.target.classList.contains("close")) {
                closeTab(name);
            } else {
                activateTab(name);
            }
        });
        tabsBar.appendChild(tab);
    }
    activateTab(name);
}

function closeTab(name) {
    const tab = tabsBar.querySelector(`.tab[data-file="${name}"]`);
    if (tab) tab.remove();
    openTabs.delete(name);

    if (activeFile === name) {
        const remaining = [...openTabs];
        if (remaining.length) {
            activateTab(remaining[remaining.length - 1]);
        } else {
            activeFile = null;
            showEmptyState();
        }
    }
    updateSidebarActive();
}

function activateTab(name) {
    activeFile = name;

    tabsBar.querySelectorAll(".tab").forEach(t =>
        t.classList.toggle("active", t.dataset.file === name)
    );

    updateSidebarActive();

    const file = FILES[name];
    const linesHtml = file.lines.map((line, i) =>
        `<div class="code-line">
            <span class="line-num">${i + 1}</span>
            <div class="line-text">${line || " "}</div>
         </div>`
    ).join("");
    codeArea.innerHTML = linesHtml;
    codeArea.scrollTop = 0;

    const activeTab = tabsBar.querySelector(`.tab[data-file="${name}"]`);
    if (activeTab) {
        activeTab.scrollIntoView({
            behavior: "smooth",
            block: "nearest",
            inline: "nearest"
        });
    }
}

function updateSidebarActive() {
    document.querySelectorAll(".sidebar .file").forEach(el =>
        el.classList.toggle("active", el.dataset.file === activeFile)
    );
}

function showEmptyState() {
    codeArea.innerHTML = `
        <div class="empty-state">
            <p>👋 Открой файл из проводника слева, чтобы начать</p>
            <p class="hint">Совет: введи <code>help</code> в терминале ниже</p>
        </div>
    `;
}

/* Клик по файлу в сайдбаре */
document.querySelectorAll(".sidebar .file").forEach(el => {
    el.addEventListener("click", (e) => {
        e.preventDefault();
        openFile(el.dataset.file);
    });
});

/* Раскрытие/закрытие папок */
document.querySelectorAll(".folder-toggle").forEach(el => {
    el.addEventListener("click", () => {
        const folderName = el.dataset.folder;
        const content = document.querySelector(`[data-folder-content="${folderName}"]`);
        if (!content) return;

        const isOpen = el.classList.toggle("open");
        el.querySelector(".arrow").textContent = isOpen ? "▾" : "▸";
        content.style.display = isOpen ? "" : "none";
    });
});

/* Прокрутка вкладок колёсиком */
tabsBar.addEventListener("wheel", (e) => {
    if (e.deltaY === 0) return;
    e.preventDefault();
    tabsBar.scrollLeft += e.deltaY;
}, { passive: false });

   ============================ */
const termBody  = document.getElementById("term-body");
const termInput = document.getElementById("term-input");

function stripHtml(html) {
    const tmp = document.createElement("div");
    tmp.innerHTML = html;
    return tmp.textContent;
}

function printTerm(text, cls = "") {
    const line = document.createElement("div");
    line.className = "term-line " + cls;
    line.textContent = text;
    termBody.appendChild(line);
    termBody.scrollTop = termBody.scrollHeight;
}

function printPrompt(command) {
    const line = document.createElement("div");
    line.className = "term-line";
    line.innerHTML = `<span class="prompt">➜</span> <span class="path">my-portfolio</span> <span class="git">git:(main)</span> <span class="cmd">${command}</span>`;
    termBody.appendChild(line);
    termBody.scrollTop = termBody.scrollHeight;
}

function clearTerm() {
    termBody.innerHTML = "";
}

const COMMANDS = {
    help() {
        printTerm("Доступные команды:", "info");
        printTerm("  help              — этот список");
        printTerm("  ls                — список файлов");
        printTerm("  cat <file>        — показать содержимое файла");
        printTerm("  whoami            — кто я");
        printTerm("  contacts          — мои контакты");
        printTerm("  screenshots       — список скриншотов");
        printTerm("  awards            — список наград");
        printTerm("  echo <text>       — вывести текст");
        printTerm("  clear             — очистить терминал");
        printTerm("  open <file>       — открыть файл во вкладке");
    },
    ls() {
        printTerm("about_me.py   my_pip_list.txt   my_stack.md   my_awards.md   contact.txt");
        printTerm("my_projects/");
        printTerm("  └── screenshots.md", "info");
    },
    cat(args) {
        if (!args.length) {
            printTerm("usage: cat <filename>", "error");
            return;
        }
        const f = FILES[args[0]];
        if (!f) {
            printTerm(`cat: ${args[0]}: No such file or directory`, "error");
            return;
        }
        f.lines.forEach(l => printTerm(stripHtml(l)));
    },
    whoami() {
        printTerm("Александр Редоран — Fullstack разработчик 👋");
    },
    contacts() {
        printTerm("📧 Email    : alexsher094@gmail.com");
        printTerm("✈️  Telegram : @theEridanVoid");
        printTerm("🅥  VK       : vk.ru/theeridanvoid");
        printTerm("💻 GitHub   : github.com/alexsher094-cloud");
    },
    screenshots() {
        if (!PROJECT_FILES.length) {
            printTerm("Нет скриншотов в static/projects/", "info");
            return;
        }
        printTerm(`Найдено ${PROJECT_FILES.length} скриншот(ов):`, "info");
        PROJECT_FILES.forEach(f => printTerm("  • " + f));
    },
    awards() {
        if (!AWARD_FILES.length) {
            printTerm("Нет наград в static/awards/", "info");
            return;
        }
        printTerm(`Найдено ${AWARD_FILES.length} награды(д):`, "info");
        AWARD_FILES.forEach(f => printTerm("  • " + f));
    },
    echo(args) {
        printTerm(args.join(" "));
    },
    clear() {
        clearTerm();
    },
    open(args) {
        if (!args.length) {
            printTerm("usage: open <filename>", "error");
            return;
        }
        if (!FILES[args[0]]) {
            printTerm(`open: ${args[0]}: No such file`, "error");
            return;
        }
        openFile(args[0]);
        printTerm(`Открыл ${args[0]}`, "info");
    }
};

termInput.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;

    const raw = termInput.value.trim();
    termInput.value = "";
    if (!raw) return;

    printPrompt(raw);

    const [cmd, ...args] = raw.split(/\s+/);
    if (COMMANDS[cmd]) {
        COMMANDS[cmd](args);
    } else {
        printTerm(`command not found: ${cmd}. Введи "help"`, "error");
    }
});

/* ============================
   ЛАЙТБОКС (клик по картинке)
   ============================ */
const lightbox        = document.getElementById("lightbox");
const lightboxImg     = document.getElementById("lightbox-img");
const lightboxCaption = document.getElementById("lightbox-caption");
const lightboxClose   = document.getElementById("lightbox-close");

function openLightbox(src, caption) {
    lightboxImg.src = src;
    lightboxImg.alt = caption || "";
    lightboxCaption.textContent = caption || "";
    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
}

function closeLightbox() {
    lightbox.classList.remove("open");
    document.body.style.overflow = "";
    setTimeout(() => {
        if (!lightbox.classList.contains("open")) {
            lightboxImg.src = "";
        }
    }, 250);
}

codeArea.addEventListener("click", (e) => {
    const img = e.target.closest(".md-image-wrap:not(.missing) img");
    if (!img) return;
    e.preventDefault();
    openLightbox(img.src, img.alt);
});

lightboxClose.addEventListener("click", closeLightbox);

lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) closeLightbox();
});

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && lightbox.classList.contains("open")) {
        closeLightbox();
    }
});

/* Клик по терминалу → фокус в input */
document.getElementById("terminal").addEventListener("click", () => termInput.focus());

/* Приветствие */
printTerm("my-portfolio terminal v1.0 — введи 'help' для списка команд", "info");
